[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsight"
version = "0.1.0"
description = "Point-in-time-correct feature store and leakage-safe ranking"
requires-python = ">=3.10"
dependencies = ["numpy>=2.2.6", "pandas>=2.3.3", "duckdb>=1.5.5", "lightgbm>=4.7.0", "scipy>=1.15.3"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[tool.setuptools]
packages = ["hindsight"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
