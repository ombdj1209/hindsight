[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsight"
version = "0.1.0"
description = "Point-in-time-correct feature store and leakage-safe ranking"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "duckdb>=1.0", "lightgbm>=4.0", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["hindsight"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
